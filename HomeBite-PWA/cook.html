<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cook dashboard | HomeBite</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ed6b3b">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script defer src="pwa.js"></script>
</head><body><header><a class="logo" href="index.html">⌂ Home<span>Bite</span></a><nav><a href="index.html">Customer site</a><a href="owner.html">Owner</a></nav></header><main class="dash"><small>YOUR LITTLE FOOD BUSINESS</small><h1>Cook dashboard</h1><p class="muted">Submit your application. Only the owner can approve cooks.</p><div class="two"><section class="panel"><h2>Cook application</h2><form id="apply"><label>Kitchen / cook name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required></label><label>City / service area<input id="area" required placeholder="e.g. Chennai, Adyar"></label><label>About your cooking<textarea id="about"></textarea></label><button class="primary">Submit for approval</button></form></section><section class="panel"><h2>Add a food listing</h2><p class="muted">Available to approved demo cooks only.</p><form id="addFood"><label>Cook email<input id="cookEmail" type="email" required></label><label>Food name<input id="foodName" required></label><label>Category<select id="category"><option>Meals</option><option>Breakfast</option><option>Snacks</option><option>Desserts</option></select></label><label>Price (₹)<input id="price" type="number" min="1" required></label><label>Photo URL (optional)<input id="photo" type="url"></label><button class="primary">Save listing</button></form></section></div><section class="panel"><h2>My listings</h2><div id="myFoods"></div><h2>My orders</h2><p class="muted">No real orders are processed in this browser preview.</p></section></main><script src="js/cook.js"></script></body></html>
